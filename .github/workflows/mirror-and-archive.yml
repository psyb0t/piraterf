name: mirror-and-archive

# The offsite copies of this repository: the GitLab mirror, the Wayback Machine
# and Software Heritage. Kept out of pipeline.yml because they share a trigger
# set with each other and with nothing in the build chain -- folding them in
# would drag the monthly cron across every build job, and each one would need an
# event guard to ignore it.
on:
  # Every branch and every tag. The mirror has to see all of them; a mirror that
  # only saw the default branch would silently drop the rest.
  push:
  # Staggered per repository. The Wayback Machine is rate-limited and one save
  # takes ~110s, so a shared cron would have every repo throttling the rest.
  # Without it the archive would never run for a repo that rarely cuts releases.
  schedule:
    - cron: "42 10 3 * *"
  workflow_dispatch:

jobs:
  mirror:
    if: github.event_name == 'push'
    uses: psyb0t/reusable-github-workflows/.github/workflows/git-mirror.yml@master
    with:
      gitlab_enabled: true
      codeberg_enabled: true
      # Gitee is off: it requires a mobile number bound to the account before
      # any repository can be public, and rather than refusing it creates the
      # repo private, so the mirror runs green while nobody can see it. Turn it
      # back on once the account is verified.
      gitee_enabled: false
    secrets:
      gitlab_token: ${{ secrets.GITLAB_TOKEN }}
      codeberg_token: ${{ secrets.CODEBERG_TOKEN }}

  # Not on every feature-branch push: the archive is rate-limited and there is
  # nothing to gain from saving a branch tip.
  archive:
    if: >-
      github.event_name != 'push' ||
      github.ref_name == github.event.repository.default_branch ||
      startsWith(github.ref, 'refs/tags/')
    uses: psyb0t/reusable-github-workflows/.github/workflows/archive.yml@master
    with:
      # Sweeps in every page the README links to, not just the repo page itself.
      # Only works on the authenticated Save Page Now API, which is why it sat
      # off until the key pair below existed -- on the keyless path the flag is
      # accepted and silently ignored.
      capture_outlinks: true
    secrets:
      wayback_access_key: ${{ secrets.WAYBACK_ACCESS_KEY }}
      wayback_secret_key: ${{ secrets.WAYBACK_SECRET_KEY }}
