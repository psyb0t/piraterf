name: archive

# Fires on a published release, and monthly regardless -- most repos here do not
# cut releases often, and an archive that only runs on release would never run
# for those at all.
#
# The cron is staggered per repository rather than shared. The Wayback Machine
# is rate-limited and a single save takes ~110s, so pointing every repo at the
# same minute would make them throttle each other.
on:
  release:
    types: [published]
  schedule:
    - cron: "42 10 3 * *"
  workflow_dispatch:

jobs:
  archive:
    uses: psyb0t/reusable-github-workflows/.github/workflows/archive.yml@master
    with:
      # Off because no archive.org keys are set on this repo. Outlink capture
      # only works on the authenticated Save Page Now API; on the keyless path
      # the flag is silently ignored, so leaving it on would just log a warning
      # every run. Add wayback_access_key / wayback_secret_key and flip this to
      # true to sweep in every page the README links to.
      capture_outlinks: false
